name: Collect permitted flight data
on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standby-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run gated collector
        env:
          STANDBY_PROVIDER_KEY: ${{ secrets.STANDBY_PROVIDER_KEY }}
        run: python standby_pipeline.py collect | tee collection-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: standby-collection-${{ github.run_id }}
          path: |
            collection-summary.json
            standby.db
          retention-days: 30
